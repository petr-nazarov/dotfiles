# Remote machines Yazi can browse over SFTP, e.g. `yazi sftp://home-media`.
# Authenticates with the personal-server key directly, since no SSH agent runs on the desktop.

[sftp.home-media]
host = "192.168.1.21"
user = "user"
port = 22
key_file = "~/.ssh/personal-server"

[sftp.home-edge]
host = "192.168.1.20"
user = "user"
port = 22
key_file = "~/.ssh/personal-server"

[sftp.home-desktop]
host = "home-desktop.netbird.cloud"
user = "nazarov"
port = 22
key_file = "~/.ssh/personal-server"

[sftp.macmom]
host = "macmom.netbird.cloud"
user = "nazarov"
port = 22
key_file = "~/.ssh/personal-server"
