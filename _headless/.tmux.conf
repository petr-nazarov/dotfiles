# Set terminal type and enable RGB color
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB"
# Optional: for compatibility with Neovim and 24-bit
set -as terminal-features ",xterm-256color:RGB"

set-option -sg escape-time 10


set -g mouse on
set-option -g focus-events on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enable native Mac OS X copy/paste
set-option -g default-command "/bin/bash -c 'which reattach-to-user-namespace >/dev/null 2>&1 && exec reattach-to-user-namespace $SHELL -l || exec $SHELL -l'"
# Window names default to the git worktree (or, outside one, the git repo root)
# the active pane sits in; see ~/.local/bin/tmux-window-name.
#
# automatic-rename is left ON, but only as a lock bit: tmux clears it the moment
# a window is named explicitly (prefix + `,`, or `new-window -n`, which is how
# tmuxinator names its windows), and tmux-window-name refuses to touch a window
# whose bit is clear. automatic-rename-format is a no-op so tmux never renames
# anything on its own - the hooks below and the zsh chpwd hook do the naming.
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format "#{window_name}"
set-hook -g after-new-session  'run -b "~/.local/bin/tmux-window-name --apply #{window_id}"'
set-hook -g after-new-window   'run -b "~/.local/bin/tmux-window-name --apply #{window_id}"'
set-hook -g after-split-window 'run -b "~/.local/bin/tmux-window-name --apply #{window_id}"'

# Prevent programs from renaming windows via escape sequences
set-option -g allow-rename off
# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Ensure window index numbers are updated automatically when a window is closed
set -g renumber-windows on


# keybindings
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind-key v copy-mode




bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

# Add 'yy' to copy the current line
bind-key -T copy-mode-vi 'y' if-shell -F "#{selection_present}" "send -X copy-selection" "send -X copy-line"

# Mouse selection copies but stays in copy-mode at the current scroll position
# (default is copy-pipe-and-cancel, which exits copy-mode and jumps to the bottom)
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind-key -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'


# Catppuccin Macchiato Palette
thm_bg="#24273a"
thm_fg="#cad3f5"
thm_cyan="#91d7e3"
thm_black="#1e2030"
thm_gray="#363a4f"
thm_magenta="#c6a0f6"
thm_pink="#f5bde6"
thm_red="#ed8796"
thm_green="#a6da95"
thm_yellow="#eed49f"
thm_blue="#8aadf4"
thm_orange="#f5a97f"
thm_black4="#5b6078"
# Status bar general
set -g status-position top 
set -g status-justify left
set -g status-style "bg=${thm_bg},fg=${thm_fg}"
set -g status-left-length "100"
set -g status-right-length "200"

# Messages
set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# Panes
set -g pane-border-lines heavy
set -g pane-border-style "fg=${thm_black4}"
set -g pane-active-border-style "fg=${thm_blue},bold"

# Dim the contents of inactive panes (darker background, muted text)
set -g window-style "fg=${thm_black4},bg=${thm_black}"
set -g window-active-style "fg=${thm_fg},bg=${thm_bg}"

# Flash the pane numbers for longer when hunting for a pane (prefix + q)
set -g display-panes-time 2000
set -g display-panes-colour "${thm_black4}"
set -g display-panes-active-colour "${thm_orange}"

# Toggle the inactive-pane dimming (some TUIs dislike a forced background)
bind-key P if -F "#{==:#{window-style},default}" \
  "set -g window-style 'fg=${thm_black4},bg=${thm_black}' ; set -g window-active-style 'fg=${thm_fg},bg=${thm_bg}' ; display 'pane dimming: on'" \
  "set -g window-style default ; set -g window-active-style default ; display 'pane dimming: off'"

# Alerts
# A bell in any window raises its flag; the flag clears when you visit it.
# visual-bell off also forwards the BEL to the outer terminal, so ghostty
# rings too. The badge itself lives in window-status-format below.
# NB: never put a comma inside #[...] within a #{?...} - tmux splits the
# conditional on it and the format silently corrupts.
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
setw -g window-status-bell-style "fg=${thm_red},bg=${thm_bg},bold"

# Session / window chooser (prefix + s, prefix + w)
# The stock tree format shows nothing at session level, so a collapsed session
# with a bell looks idle. This is the default format plus an alert marker on
# both session and window rows. Same comma rule as above: no commas in #[...].
bind s choose-tree -Zs -F "#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,},#{?window_format,#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?window_bell_flag,#[fg=${thm_red}]#[bold] 󰂚#[default],},#{?session_alerts,#[fg=${thm_red}]#[bold]󰂚 #{session_alerts}  #[default],}#{session_windows} windows#{?session_attached, (attached),}}}"
bind w choose-tree -Zw -F "#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,},#{?window_format,#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?window_bell_flag,#[fg=${thm_red}]#[bold] 󰂚#[default],},#{?session_alerts,#[fg=${thm_red}]#[bold]󰂚 #{session_alerts}  #[default],}#{session_windows} windows#{?session_attached, (attached),}}}"

# Windows
setw -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
setw -g window-status-separator ""
setw -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"

# Status Left
# Shows the session name in a blue pill
set -g status-left "#[fg=${thm_bg},bg=${thm_blue},bold]  #S #[fg=${thm_blue},bg=${thm_bg},nobold,nounderscore,noitalics]"

# Status Right
# Shows the host and the time
set -g status-right "#{S:#{?#{&&:#{!=:#{session_alerts},},#{!=:#{session_name},#{client_session}}},#[fg=${thm_bg}]#[bg=${thm_red}]#[bold] 󰂚 #{session_name}:#{session_alerts} #[default],}}#[fg=${thm_gray},bg=${thm_bg},nobold,nounderscore,noitalics]#[fg=${thm_blue},bg=${thm_gray}] 󰭦 %Y-%m-%d  %H:%M #[fg=${thm_magenta},bg=${thm_gray},nobold,nounderscore,noitalics]#[fg=${thm_bg},bg=${thm_magenta}] 󰃭 #(whoami) "

# Current Window
setw -g window-status-current-format "#[fg=${thm_bg},bg=${thm_orange}] #I #[fg=${thm_fg},bg=${thm_gray}] #{?window_bell_flag,#[fg=${thm_red}]#[bold]󰂚 #[fg=${thm_fg}]#[nobold],}#W #[fg=${thm_gray},bg=${thm_bg},nobold]"

# Inactive Window
setw -g window-status-format "#[fg=${thm_fg},bg=${thm_bg}] #I #[fg=${thm_fg},bg=${thm_bg}] #{?window_bell_flag,#[fg=${thm_red}]#[bold]󰂚 #[fg=${thm_fg}]#[nobold],}#W #[fg=${thm_bg},bg=${thm_bg},nobold]"


run '~/.tmux/plugins/tpm/tpm'

