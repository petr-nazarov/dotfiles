# kitty, set up to behave like the ghostty config next door (../ghostty/config).
# Every option and its default: https://sw.kovidgoyal.net/kitty/conf/

include ./macchiato.conf

# --------------------------------------------------------------------- font
font_family Fira Code
font_size 20.0
# ghostty: font-thicken = true (macOS only)
macos_thicken_font 0.2

# ------------------------------------------------------------------- window
# ghostty: window-decoration = false
hide_window_decorations yes
confirm_os_window_close 0
# ghostty: window-save-state = never. Remembering the size also remembers
# "maximized", and a new window that asks to start maximized skips the
# Hyprland/yabai tiling.
remember_window_size no
# skhd launches every window as its own instance (open -n), so without this
# each closed window leaves a Dock icon behind
macos_quit_when_last_window_closed yes

# ---------------------------------------------------------------- clipboard
# ghostty: copy-on-select = true
copy_on_select clipboard
# ghostty: clipboard-read/clipboard-write = allow. OSC 52 copy is what nvim
# (in a devcontainer), tmux (set-clipboard on) and ~/.local/bin/clip rely on.
clipboard_control write-clipboard write-primary read-clipboard read-primary
# ghostty: clipboard-paste-protection = false
paste_actions quote-urls-at-prompt

# --------------------------------------------------------------------- term
# ghostty: term = xterm-256color. Every host and container knows it, while
# xterm-kitty needs its own terminfo entry on the far side of ssh.
term xterm-256color

# --------------------------------------------------------------------- bell
# ghostty: bell-features = audio,attention,title,border. No visual bell:
# kitty can only flash the whole window, which flickers on every Claude
# reply. window_alert_on_bell stands in for `attention`. kitty's own audio
# bell can't take a volume, so bell-sound plays the file instead.
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes
bell_on_tab "🔔 "
# Through sh for $HOME: kitty started from the Dock or Hyprland has no
# ~/.local/bin on its PATH
command_on_bell sh -c 'exec "$HOME/.local/bin/bell-sound"'

# ----------------------------------------------------------------- keyboard
# Claude Code: newline instead of submit. ESC+CR survives tmux, ssh and
# docker exec unchanged. `all` covers the kitty keyboard protocol too, which
# Claude turns on when it runs outside tmux.
map shift+enter send_text all \x1b\r
# Paste images too: sends ctrl+v when the clipboard holds only an image
map kitty_mod+v kitten paste.py

# No tabs or splits, tmux does that (ghostty unbound the same keys)
map cmd+t            no_op
map cmd+enter        no_op
map shift+cmd+[      no_op
map shift+cmd+]      no_op
map kitty_mod+t      no_op
map kitty_mod+enter  no_op

# macOS: skhd sends this on cmd+shift+q, yabai can't close a window without
# decorations
map cmd+ctrl+alt+w close_os_window

# ------------------------------------------------------------------ colours
# Match ghostty's catppuccin-macchiato theme where kitty's port differs
selection_foreground #cad3f5
selection_background #3a3e53
color8  #5b6078
color15 #a5adcb
